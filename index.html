<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Summoners War - Guild Siege Teams</title>
<style>
  /* =====================================================================
     STYLES - ธีมมืดสบายตา รองรับมือถือ 100%
  ===================================================================== */
  :root {
    --bg: #0f1117;
    --card: #181b24;
    --card-hover: #212633;
    --border: #2a3040;
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --accent: #f59e0b;
    --accent-soft: rgba(245, 158, 11, 0.15);
    --fire: #ef4444;
    --water: #3b82f6;
    --wind: #eab308;
    --light: #f8fafc;
    --dark: #a855f7;
    --win: #10b981;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Thai", sans-serif; }
  body { background: var(--bg); color: var(--text); padding-bottom: 40px; -webkit-tap-highlight-color: transparent; }

  /* Header */
  header {
    background: linear-gradient(180deg, #1a1e29 0%, #0f1117 100%);
    padding: 16px 16px 12px;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 50;
  }
  .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  h1 { font-size: 1.15rem; font-weight: 700; color: var(--accent); letter-spacing: 0.3px; }
  .badge-count { font-size: 0.78rem; background: var(--card); border: 1px solid var(--border); padding: 3px 10px; border-radius: 99px; color: var(--text-muted); }

  /* Main Tabs: ทีมตั้งรับ / ทีมโจมตี */
  .tabs-main { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .tab-btn {
    background: var(--card); border: 1px solid var(--border); color: var(--text-muted);
    padding: 10px; border-radius: 10px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: 0.15s;
  }
  .tab-btn.active { background: var(--accent); color: #0f1117; border-color: var(--accent); }

  /* Star Filter: บ้าน 5★ / บ้าน 4★ */
  .tabs-star { display: flex; gap: 6px; margin-bottom: 10px; }
  .star-btn {
    flex: 1; background: var(--card); border: 1px solid var(--border); color: var(--text-muted);
    padding: 7px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer;
  }
  .star-btn.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

  /* Search & Element Filter */
  .controls { padding: 12px 16px 4px; max-width: 720px; margin: 0 auto; }
  .search-box {
    width: 100%; background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 10px 14px; border-radius: 10px; font-size: 0.95rem; margin-bottom: 10px; outline: none;
  }
  .search-box:focus { border-color: var(--accent); }

  .elem-filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
  .elem-filters::-webkit-scrollbar { display: none; }
  .elem-btn {
    background: var(--card); border: 1px solid var(--border); color: var(--text-muted);
    padding: 6px 12px; border-radius: 99px; font-size: 0.8rem; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .elem-btn.active { border-color: var(--text); color: var(--text); background: #262c3a; }
  .elem-btn[data-elem="ไฟ"].active { border-color: var(--fire); color: var(--fire); }
  .elem-btn[data-elem="น้ำ"].active { border-color: var(--water); color: var(--water); }
  .elem-btn[data-elem="ลม"].active { border-color: var(--wind); color: var(--wind); }
  .elem-btn[data-elem="แสง"].active { border-color: var(--light); color: var(--light); }
  .elem-btn[data-elem="มืด"].active { border-color: var(--dark); color: var(--dark); }

  /* List Container */
  .container { padding: 8px 16px; max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }

  /* Team Card */
  .team-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; transition: 0.15s;
  }
  .team-card.clickable { cursor: pointer; }
  .team-card.clickable:hover { border-color: #3f485e; background: var(--card-hover); }

  .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 0.78rem; color: var(--text-muted); }
  .star-tag { background: #262c3a; color: var(--accent); padding: 2px 8px; border-radius: 6px; font-weight: 700; }
  .counter-hint { color: var(--win); font-weight: 600; }

  /* 3 Monsters Row */
  .monsters-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .mon-box {
    background: #12151c; border: 1px solid var(--border); border-radius: 9px;
    padding: 8px 6px; text-align: center; position: relative;
  }
  .mon-lead {
    position: absolute; top: -7px; left: 50%; transform: translateX(-50%);
    background: var(--accent); color: #000; font-size: 0.62rem; font-weight: 800;
    padding: 1px 6px; border-radius: 4px; letter-spacing: 0.3px;
  }
  .mon-elem { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
  .elem-ไฟ { background: var(--fire); }
  .elem-น้ำ { background: var(--water); }
  .elem-ลม { background: var(--wind); }
  .elem-แสง { background: var(--light); box-shadow: 0 0 4px #fff; }
  .elem-มืด { background: var(--dark); }

  .mon-name { font-size: 0.88rem; font-weight: 600; display: block; margin-top: 2px; line-height: 1.25; }
  .mon-sub { font-size: 0.72rem; color: var(--text-muted); margin-top: 3px; display: block; }

  /* Target info on Offense Tab */
  .target-label {
    margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--border);
    font-size: 0.78rem; color: var(--text-muted); display: flex; justify-content: space-between;
  }

  .empty-state { text-align: center; padding: 40px 16px; color: var(--text-muted); font-size: 0.9rem; }

  /* Modal Bottom Sheet (Mobile Friendly) */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 100;
    display: none; align-items: flex-end; justify-content: center;
  }
  .modal-backdrop.open { display: flex; }
  .modal-sheet {
    background: #161922; border-top: 1px solid var(--border); border-radius: 18px 18px 0 0;
    width: 100%; max-width: 720px; max-height: 85vh; overflow-y: auto; padding: 18px 16px 28px;
    animation: slideUp 0.2s ease-out;
  }
  @media (min-width: 640px) {
    .modal-backdrop { align-items: center; padding: 16px; }
    .modal-sheet { border-radius: 16px; border: 1px solid var(--border); }
  }
  @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .modal-title { font-size: 1rem; font-weight: 700; color: var(--accent); }
  .close-btn { background: var(--card); border: 1px solid var(--border); color: var(--text); width: 32px; height: 32px; border-radius: 8px; font-size: 1.1rem; cursor: pointer; }

  .def-preview { background: #10131a; border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-bottom: 14px; }
  .def-preview-label { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 6px; }

  .counter-item { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .counter-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .counter-badge { font-size: 0.75rem; font-weight: 700; color: var(--win); background: rgba(16,185,129,0.12); padding: 2px 8px; border-radius: 6px; }
  .counter-note { font-size: 0.8rem; color: #cbd5e1; margin-top: 8px; background: #12151c; padding: 8px 10px; border-radius: 8px; line-height: 1.4; }
  .rune-tag { display: inline-block; font-size: 0.7rem; color: var(--accent); margin-top: 3px; font-weight: 600; }
  .spd-tag { display: inline-block; font-size: 0.7rem; color: #38bdf8; font-weight: 600; }
</style>
</head>
<body>

</script>

<!-- ================= UI LAYOUT ================= -->
<header>
  <div class="header-top">
    <h1>⚔️ รวมทีม Siege กิลด์</h1>
    <span class="badge-count" id="resultCount">0 ทีม</span>
  </div>

  <!-- แท็บหลัก -->
  <div class="tabs-main">
    <button class="tab-btn active" data-tab="defense">🛡️ ทีมตั้งรับ</button>
    <button class="tab-btn" data-tab="offense">⚔️ ทีมโจมตี</button>
  </div>

  <!-- แยกบ้าน 5★ / 4★ -->
  <div class="tabs-star">
    <button class="star-btn active" data-star="all">ทั้งหมด</button>
    <button class="star-btn" data-star="5">⭐ บ้าน 5★</button>
    <button class="star-btn" data-star="4">⭐ บ้าน 4★</button>
  </div>
</header>

<div class="controls">
  <input type="text" id="searchInput" class="search-box" placeholder="🔍 ค้นหาชื่อมอนสเตอร์ (เช่น คาร์คาโน่, ลีโอ)...">
  <div class="elem-filters">
    <button class="elem-btn active" data-elem="all">ทุกธาตุ</button>
    <button class="elem-btn" data-elem="ไฟ">🔥 ไฟ</button>
    <button class="elem-btn" data-elem="น้ำ">💧 น้ำ</button>
    <button class="elem-btn" data-elem="ลม">🌪️ ลม</button>
    <button class="elem-btn" data-elem="แสง">☀️ แสง</button>
    <button class="elem-btn" data-elem="มืด">🌑 มืด</button>
  </div>
</div>

<main class="container" id="teamList"></main>

<!-- Modal แสดงทีมตีแก้ทาง -->
<div class="modal-backdrop" id="counterModal">
  <div class="modal-sheet">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">⚔️ ทีมโจมตีที่เคยชนะ</div>
      <button class="close-btn" id="closeModal">✕</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
/* =====================================================================
   APPLICATION LOGIC
===================================================================== */
let state = {
  tab: "defense",   // "defense" | "offense"
  star: "all",      // "all" | "5" | "4"
  elem: "all",      // "all" | "ไฟ" | "น้ำ" | "ลม" | "แสง" | "มืด"
  search: ""
};

const teamListEl = document.getElementById("teamList");
const resultCountEl = document.getElementById("resultCount");
const modalEl = document.getElementById("counterModal");
const modalBodyEl = document.getElementById("modalBody");
const modalTitleEl = document.getElementById("modalTitle");

// สร้าง HTML กล่องมอนสเตอร์ 1 ตัว
function renderMonBox(mon, isLeader, showStats = false) {
  return `
    <div class="mon-box">
      ${isLeader ? '<span class="mon-lead">หัวหน้า</span>' : ''}
      <span class="mon-name"><span class="mon-elem elem-${mon.elem}"></span>${mon.name}</span>
      ${showStats ? `
        <span class="rune-tag">${mon.rune || '-'}</span>
        <span class="spd-tag">SPD ${mon.spd || '-'}</span>
      ` : `<span class="mon-sub">ธาตุ${mon.elem}</span>`}
    </div>
  `;
}

// ตรวจสอบเงื่อนไขการค้นหาและกรองธาตุ
function matchFilters(monsters) {
  const q = state.search.trim().toLowerCase();
  const matchSearch = !q || monsters.some(m => m.name.toLowerCase().includes(q));
  const matchElem = state.elem === "all" || monsters.some(m => m.elem === state.elem);
  return matchSearch && matchElem;
}

// แสดงรายการหลัก
function render() {
  teamListEl.innerHTML = "";
  let count = 0;

  if (state.tab === "defense") {
    const filtered = SIEGE_DATA.filter(item => {
      const matchStar = state.star === "all" || String(item.star) === state.star;
      return matchStar && matchFilters(item.defense);
    });

    count = filtered.length;
    if (count === 0) {
      teamListEl.innerHTML = `<div class="empty-state">ไม่พบทีมตั้งรับที่ตรงกับเงื่อนไข</div>`;
    } else {
      filtered.forEach(item => {
        const card = document.createElement("div");
        card.className = "team-card clickable";
        card.innerHTML = `
          <div class="card-top">
            <span class="star-tag">บ้าน ${item.star}★</span>
            <span class="counter-hint">กดดูทีมตีชนะ (${item.counters.length} ทีม) ▸</span>
          </div>
          <div class="monsters-row">
            ${item.defense.map((m, idx) => renderMonBox(m, idx === 0, false)).join("")}
          </div>
        `;
        card.addEventListener("click", () => openCounterModal(item));
        teamListEl.appendChild(card);
      });
    }
  } else {
    // แท็บทีมโจมตี: ดึงทีมโจมตีทั้งหมดออกมาแสดงพร้อมรูน/SPD และบอกว่าใช้ตีทีมไหน
    const offenseList = [];
    SIEGE_DATA.forEach(defItem => {
      const matchStar = state.star === "all" || String(defItem.star) === state.star;
      if (!matchStar) return;
      defItem.counters.forEach(cnt => {
        if (matchFilters(cnt.monsters)) {
          offenseList.push({ star: defItem.star, target: defItem.defense, counter: cnt });
        }
      });
    });

    count = offenseList.length;
    if (count === 0) {
      teamListEl.innerHTML = `<div class="empty-state">ไม่พบทีมโจมตีที่ตรงกับเงื่อนไข</div>`;
    } else {
      offenseList.forEach(entry => {
        const targetNames = entry.target.map(m => m.name).join(" / ");
        const card = document.createElement("div");
        card.className = "team-card";
        card.innerHTML = `
          <div class="card-top">
            <span class="star-tag">บ้าน ${entry.star}★</span>
            <span class="counter-badge">✓ ชนะทาง</span>
          </div>
          <div class="monsters-row">
            ${entry.counter.monsters.map((m, idx) => renderMonBox(m, idx === 0, true)).join("")}
          </div>
          ${entry.counter.note ? `<div class="counter-note">💡 ${entry.counter.note}</div>` : ''}
          <div class="target-label">
            <span>ใช้ตีเด็ค: <strong>${targetNames}</strong></span>
          </div>
        `;
        teamListEl.appendChild(card);
      });
    }
  }

  resultCountEl.textContent = `${count} ทีม`;
}

// เปิด Modal ดูทีมตีแก้ทางเมื่อกดที่เด็คตั้งรับ
function openCounterModal(defItem) {
  modalTitleEl.textContent = `⚔️ ทีมตีแก้ทาง (บ้าน ${defItem.star}★)`;
  const defPreview = `
    <div class="def-preview">
      <div class="def-preview-label">🛡️ เด็คตั้งรับเป้าหมาย:</div>
      <div class="monsters-row">
        ${defItem.defense.map((m, idx) => renderMonBox(m, idx === 0, false)).join("")}
      </div>
    </div>
  `;

  const countersHtml = defItem.counters.length === 0
    ? `<div class="empty-state">ยังไม่มีบันทึกทีมตีชนะสำหรับเด็คนี้</div>`
    : defItem.counters.map((cnt, i) => `
      <div class="counter-item">
        <div class="counter-head">
          <span class="counter-badge">✓ ทีมโจมตีที่ ${i + 1}</span>
        </div>
        <div class="monsters-row">
          ${cnt.monsters.map((m, idx) => renderMonBox(m, idx === 0, true)).join("")}
        </div>
        ${cnt.note ? `<div class="counter-note">💡 ${cnt.note}</div>` : ''}
      </div>
    `).join("");

  modalBodyEl.innerHTML = defPreview + countersHtml;
  modalEl.classList.add("open");
}

// Event Listeners
document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    state.tab = btn.dataset.tab;
    render();
  });
});

document.querySelectorAll(".star-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".star-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    state.star = btn.dataset.star;
    render();
  });
});

document.querySelectorAll(".elem-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".elem-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    state.elem = btn.dataset.elem;
    render();
  });
});

document.getElementById("searchInput").addEventListener("input", e => {
  state.search = e.target.value;
  render();
});

document.getElementById("closeModal").addEventListener("click", () => modalEl.classList.remove("open"));
modalEl.addEventListener("click", e => { if (e.target === modalEl) modalEl.classList.remove("open"); });

// เริ่มทำงาน
render();
</script>
</body>
</html>
